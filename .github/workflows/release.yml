name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v$VERSION" || { echo 'Run this workflow against the tag matching package.json'; exit 1; }
      - uses: ./.github/actions/setup
      - name: Check source
        run: |
          npm run typecheck
          npm run lint
          npm test
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Restore release signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || { echo 'Configure all four signing secrets listed in doc/RELEASING.md'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/music-plus-release.keystore
      - name: Build signed APKs and run Android unit tests
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: music-plus-release.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          npm run pack:android
      - name: Verify APK signatures
        shell: bash
        run: |
          for apk in build/apk/music-plus-v*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$apk"
          done
      - name: Publish APK downloads
        uses: softprops/action-gh-release@v2
        with:
          body_path: publish/release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/apk/music-plus-v*.apk
            build/apk/SHA256SUMS.txt
      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/music-plus-release.keystore
