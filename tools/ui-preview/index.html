<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LX Music · 夜航 UI 预览</title><style>
@font-face{font-family:icomoon;src:url('/icomoon.ttf') format('truetype')}
*{box-sizing:border-box}body{margin:0;background:#06090d;color:#edf3f5;font-family:system-ui,sans-serif}button,select{font:inherit}#root{min-height:100vh}.workspace{max-width:1100px;margin:auto;padding:38px 32px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:28px}.toolbar h1{font-size:22px;margin:0 auto 0 0;letter-spacing:-.5px}.toolbar button,.toolbar select{padding:9px 14px;background:#18212c;border:1px solid #2c3a49;border-radius:12px;color:#b8c7d3;cursor:pointer}.toolbar p{width:100%;margin:0;color:#8b9aaa;font-size:12px}.stage{display:flex;gap:56px;align-items:flex-start;justify-content:center}.phone{display:flex;flex-direction:column;width:375px;height:812px;border:1px solid #2b3644;border-radius:38px;overflow:hidden;box-shadow:0 28px 90px #0007;flex:none}.caption{font-size:11px;letter-spacing:2px;color:#8495a6;margin:20px 0;text-align:center}.aside{max-width:250px;margin-top:80px}.aside span{color:#58e0c1;font-size:11px;letter-spacing:3px}.aside h2{font-size:36px;letter-spacing:-1px;line-height:1.3;font-weight:600}.aside p{font-size:14px;line-height:1.9;color:#92a4b5}.aside .line{height:1px;background:#293440;margin:30px 0}@media(max-width:720px){.workspace{padding:20px 8px}.toolbar{padding:0 12px}.stage{gap:0}.aside{display:none}.phone{max-width:100%;border-radius:24px}.toolbar h1{font-size:18px}}
</style></head><body><div id="root"></div><script src="/app.js"></script></body></html>
