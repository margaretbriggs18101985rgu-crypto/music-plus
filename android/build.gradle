// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 36
        targetSdkVersion = 29

        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.10.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Native libraries declare historical AGP versions in their own buildscript blocks.
// Compile all application subprojects with the same API-36-compatible plugin.
subprojects {
    plugins.withId("com.android.library") {
        android.ndkVersion = rootProject.ext.ndkVersion
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
    buildscript.repositories {
        google()
    }
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") {
                details.useVersion("8.10.1")
            }
        }
    }
}

allprojects {
    repositories.configureEach { repository ->
        if (repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            def repositoryUrl = repository.url.toString()
            // RN registers this historical snapshot repository first. Stable AndroidX
            // artifacts belong to Google Maven, not the retired snapshot endpoint.
            if (repositoryUrl.startsWith("https://oss.sonatype.org/content/repositories/snapshots")) {
                repository.content {
                    includeVersionByRegex("com.facebook.react", ".*", ".*-SNAPSHOT")
                }
            }
            if (repositoryUrl.startsWith("https://repo.maven.apache.org/maven2")) {
                repository.content { excludeGroupByRegex("androidx\\..*") }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
